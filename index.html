<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f4f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Workstation">
<title>Workstation</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1 id="title">毎日確認</h1>
  <div class="topActs" id="topActs"></div>
</header>

<main id="view"></main>

<nav class="tabs" id="tabs">
  <button type="button" data-tab="today"><span data-icon="list-checks"></span><b>毎日確認</b></button>
  <button type="button" data-tab="gantt"><span data-icon="chart-gantt"></span><b>ガント</b></button>
  <button type="button" data-tab="cal"><span data-icon="calendar-days"></span><b>カレンダー</b></button>
  <button type="button" data-tab="sync"><span data-icon="smartphone"></span><b>同期</b><i class="badge" id="syncBadge" hidden></i></button>
</nav>

<!-- 下から出るシート（タスクの編集など） -->
<dialog id="sheet"><div class="sheetIn" id="sheetIn"></div></dialog>
<input type="file" id="filePick" accept=".json,application/json" hidden>
<div id="toast" hidden></div>

<script src="icons.js"></script>
<script src="model.js"></script>
<script src="app.js"></script>
</body>
</html>
